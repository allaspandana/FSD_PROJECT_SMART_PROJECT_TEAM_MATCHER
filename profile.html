<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile | Smart Team Matcher</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <a class="logo" href="index.html">Smart Team Matcher</a>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a class="active" href="profile.html">Profile</a>
        <a href="project.html">Project</a>
        <a href="matches.html">Matches</a>
        <a href="student.html">Students</a>
        <a href="team.html">Team</a>
    </div>
</nav>

<main class="form-page">
    <section class="form-section">
        <div class="form-heading">
            <span class="page-label">STUDENT PROFILE</span>
            <h1>Create Your Profile</h1>
            <p>Enter your details so the matcher can find relevant teammates.</p>
        </div>

        <form id="profileForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="skills">Skills</label>
            <input type="text" id="skills" placeholder="HTML, CSS, JavaScript, Python" required>
            <small>Separate multiple skills with commas.</small>

            <label for="interests">Interests</label>
            <input type="text" id="interests" placeholder="Web Development, AI, Database" required>
            <small>Separate multiple interests with commas.</small>

            <label for="role">Preferred Role</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Full Stack">Full Stack</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Database">Database</option>
                <option value="AI/ML">AI/ML</option>
            </select>

            <label for="experience">Experience Level</label>
            <select id="experience" required>
                <option value="">Select Experience</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <label for="availability">Availability</label>
            <select id="availability" required>
                <option value="">Select Availability</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <button type="submit" class="primary-btn">Save Profile</button>
        </form>
    </section>
</main>
<script src="js/profile.js"></script>
</body>
</html>
