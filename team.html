<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Teams | Smart Team Matcher</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* ================= TEAM PAGE ================= */

        .team-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 30px;
        }


        /* ================= PAGE HEADER ================= */

        .page-header {
            margin-bottom: 35px;
        }

        .page-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #667eea;
        }

        .page-header h1 {
            margin: 8px 0;
            font-size: 34px;
            color: #222;
        }

        .page-header p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }


        /* ================= SUMMARY ================= */

        .team-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .summary-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 30px;
            font-weight: 700;
            color: #333;
        }


        /* ================= PROJECT CONTAINER ================= */

        .team-projects {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }


        /* ================= PROJECT CARD ================= */

        .project-team-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }


        /* ================= PROJECT TOP ================= */

        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding-bottom: 22px;
            border-bottom: 1px solid #eee;
        }

        .project-details {
            flex: 1;
        }

        .project-number {
            font-size: 12px;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .project-name {
            font-size: 23px;
            font-weight: 700;
            color: #222;
            margin: 7px 0;
        }

        .project-description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }


        /* ================= TEAM COUNT ================= */

        .team-size {
            min-width: 110px;
            text-align: center;
            background: #f5f6ff;
            border-radius: 12px;
            padding: 12px 15px;
        }

        .team-size-number {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .team-size-text {
            font-size: 12px;
            color: #777;
        }


        /* ================= PROJECT ACTIONS ================= */

        .project-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .project-action-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .matches-btn {
            background: #667eea;
            color: white;
        }

        .matches-btn:hover {
            background: #5568d8;
        }

        .delete-project-btn {
            background: #fff1f1;
            color: #d9534f;
        }

        .delete-project-btn:hover {
            background: #ffe0e0;
        }


        /* ================= MEMBERS SECTION ================= */

        .members-section {
            margin-top: 25px;
        }

        .members-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .members-heading h3 {
            margin: 0;
            font-size: 17px;
            color: #333;
        }


        /* ================= MEMBER LIST ================= */

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
        }


        /* ================= MEMBER AVATAR ================= */

        .member-avatar {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
        }


        /* ================= MEMBER INFO ================= */

        .member-info {
            flex: 1;
            min-width: 0;
        }

        .member-name {
            font-weight: 700;
            color: #333;
            margin-bottom: 3px;
        }

        .member-email {
            font-size: 13px;
            color: #888;
            word-break: break-word;
        }

        .member-role {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 9px;
            border-radius: 20px;
            background: #eef0ff;
            color: #667eea;
            font-size: 11px;
            font-weight: 600;
        }


        /* ================= REMOVE BUTTON ================= */

        .remove-member-btn {
            border: 1px solid #e5e5e5;
            background: white;
            color: #d9534f;
            padding: 8px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .remove-member-btn:hover {
            background: #fff1f1;
            border-color: #f0c0c0;
        }


        /* ================= EMPTY TEAM ================= */

        .empty-team {
            text-align: center;
            padding: 30px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px dashed #ddd;
        }

        .empty-team p {
            color: #888;
            margin: 0 0 15px;
        }

        .find-members-btn {
            border: none;
            background: #667eea;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .find-members-btn:hover {
            background: #5568d8;
        }


        /* ================= NO PROJECTS ================= */

        .no-projects {
            text-align: center;
            background: white;
            border: 1px dashed #ccc;
            border-radius: 16px;
            padding: 50px 20px;
            color: #777;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .team-page {
                padding: 30px 15px;
            }

            .team-summary {
                grid-template-columns: 1fr;
            }

            .project-top {
                flex-direction: column;
            }

            .team-size {
                width: 100%;
                box-sizing: border-box;
            }

            .member-row {
                align-items: flex-start;
            }

            .remove-member-btn {
                margin-left: auto;
            }

        }

    </style>

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            SMART TEAM MATCHER
        </div>


        <div class="nav-links">

            <a href="index.html">
                Dashboard
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="project.html">
                Project
            </a>

            <a href="matches.html">
                Matches
            </a>

            <a href="student.html">
                Students
            </a>

            <a
                href="team.html"
                class="active"
            >
                Team
            </a>

        </div>

    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="team-page">


        <!-- ================= PAGE HEADER ================= -->

        <div class="page-header">

            <span class="page-label">
                TEAM MANAGEMENT
            </span>


            <h1>
                My Project Teams
            </h1>


            <p>
                View and manage all your current and previous project teams.
            </p>

        </div>


        <!-- ================= TEAM SUMMARY ================= -->

        <section
            id="teamSummary"
            class="team-summary"
        >

        </section>


        <!-- ================= ALL PROJECT TEAMS ================= -->

        <section
            id="teamMembers"
            class="team-projects"
        >

        </section>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/team.js"></script>


</body>

</html>
